<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif">
  <!--
    Demo video · Act 3 visual · 1920x1080 (native recording resolution)
    ENGLISH ONLY — judge-facing asset.

    Number provenance (must match src/ranking/ranker.py):
      price presence counts a product only when float() parses the field
      → 20.8%, not the looser non-empty test which gives 21.1%
    Data: data/public_set.jsonl (200 targets) + data/catalog.jsonl (50,000 products)

    LAYOUT BUDGET — keep these or text collides (this bit me once already):
      label column      x 120 …  300
      bars              x 330 … 1230  (max width 900)
      value labels      x 1270, left-aligned, ≤ 5 glyphs at 46px mono ≈ 140px → ends ≤ 1410
      multiplier        right-aligned at x 1800, 86px mono
      body copy         font-size ≤ 34 and ≤ 92 chars, or it overruns the 1920 canvas
  -->
  <defs>
    <linearGradient id="tgt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2BC48A"/><stop offset="100%" stop-color="#4EE0A8"/>
    </linearGradient>
    <linearGradient id="cat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A4A55"/><stop offset="100%" stop-color="#4A5C69"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#0E1512"/>

  <!-- Title -->
  <text x="120" y="150" fill="#E7EEEA" font-size="58" font-weight="700">Target products vs. the whole catalogue</text>
  <text x="120" y="208" fill="#8D9C96" font-size="32">200 hidden targets  ·  50,000-product catalogue</text>
  <line x1="120" y1="252" x2="1800" y2="252" stroke="#2C3833" stroke-width="2"/>

  <!-- ── Metric 1 ── -->
  <text x="120" y="352" fill="#E7EEEA" font-size="40" font-weight="600">Review count (median)</text>

  <text x="120" y="432" fill="#8D9C96" font-size="29">Targets</text>
  <rect x="330" y="400" width="900" height="52" rx="6" fill="url(#tgt)"/>
  <text x="1270" y="440" fill="#4EE0A8" font-size="46" font-weight="700"
        font-family="'IBM Plex Mono',ui-monospace,monospace">6,846</text>

  <text x="120" y="510" fill="#8D9C96" font-size="29">Catalogue</text>
  <rect x="330" y="478" width="8" height="52" rx="4" fill="url(#cat)"/>
  <text x="366" y="518" fill="#8D9C96" font-size="46" font-weight="600"
        font-family="'IBM Plex Mono',ui-monospace,monospace">12</text>

  <text x="1800" y="490" fill="#E7EEEA" font-size="86" font-weight="700" text-anchor="end"
        font-family="'IBM Plex Mono',ui-monospace,monospace">570×</text>

  <!-- ── Metric 2 ── -->
  <text x="120" y="668" fill="#E7EEEA" font-size="40" font-weight="600">Has a price field</text>

  <text x="120" y="748" fill="#8D9C96" font-size="29">Targets</text>
  <rect x="330" y="716" width="900" height="52" rx="6" fill="url(#tgt)"/>
  <text x="1270" y="756" fill="#4EE0A8" font-size="46" font-weight="700"
        font-family="'IBM Plex Mono',ui-monospace,monospace">89.0%</text>

  <text x="120" y="826" fill="#8D9C96" font-size="29">Catalogue</text>
  <rect x="330" y="794" width="210" height="52" rx="6" fill="url(#cat)"/>
  <text x="576" y="834" fill="#8D9C96" font-size="46" font-weight="600"
        font-family="'IBM Plex Mono',ui-monospace,monospace">20.8%</text>

  <text x="1800" y="806" fill="#E7EEEA" font-size="86" font-weight="700" text-anchor="end"
        font-family="'IBM Plex Mono',ui-monospace,monospace">4.3×</text>

  <!-- Takeaway — split across two lines so neither overruns the canvas -->
  <line x1="120" y1="912" x2="1800" y2="912" stroke="#2C3833" stroke-width="2"/>
  <text x="120" y="968" fill="#E7EEEA" font-size="34">Targets come from <tspan fill="#4EE0A8" font-weight="700">real purchase records</tspan>.</text>
  <text x="120" y="1012" fill="#E7EEEA" font-size="34">People buy popular items — and only items that sold have price data.</text>
  <text x="120" y="1054" fill="#66756F" font-size="25">Two signals that were sitting in the data, unused.　　Top bars not to scale — magnitude only.</text>
</svg>
