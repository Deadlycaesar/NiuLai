<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif">
  <!--
    Demo video · Act 4① visual · 1920x1080 (native recording resolution)
    ENGLISH ONLY — judge-facing asset.

    Numbers: per-session score contribution under
      0.5 x Hit  +  0.3 x ReciprocalRank  +  0.2 x (11 - turn) / 10
      A  hit on turn 1 at rank 7 : 0.500 + 0.043 + 0.200 = 0.743
      B  hit on turn 2 at rank 1 : 0.500 + 0.300 + 0.180 = 0.980
    Verify:  python3 -c "print(0.5+0.3/7+0.2, 0.5+0.3+0.18)"
    Live rank-1 count: python3 -m evaluator.local_evaluator  (192/200; was 106 before)

    LAYOUT BUDGET — keep these or text collides (this already bit prior-axis.svg once):
      row label      x 120 …  700   (font 34, <= 30 chars)
      stacked bar    x 720 … 1560   (total width 840 = score 1.000)
      total value    right-aligned at x 1800, 62px mono
      body copy      font-size <= 34 and <= 92 chars per line
    Verify by rendering, never by reading source:
      qlmanage -t -s 2400 -o <dir> team/assets/withholding-ledger.svg
  -->
  <defs>
    <linearGradient id="mrr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2BC48A"/><stop offset="100%" stop-color="#4EE0A8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#0E1512"/>

  <!-- Title -->
  <text x="120" y="146" fill="#E7EEEA" font-size="58" font-weight="700">A hit ends the session — and locks in that rank</text>
  <text x="120" y="204" fill="#8D9C96" font-size="32">Score contributed by one session  ·  0.5×Hit + 0.3×MRR + 0.2×Efficiency</text>
  <line x1="120" y1="248" x2="1800" y2="248" stroke="#2C3833" stroke-width="2"/>

  <!-- Legend -->
  <rect x="120" y="300" width="26" height="26" rx="4" fill="#33463E"/>
  <text x="160" y="322" fill="#8D9C96" font-size="27">Hit  0.500</text>
  <rect x="380" y="300" width="26" height="26" rx="4" fill="#3ED39A"/>
  <text x="420" y="322" fill="#8D9C96" font-size="27">MRR</text>
  <rect x="560" y="300" width="26" height="26" rx="4" fill="#4A5C69"/>
  <text x="600" y="322" fill="#8D9C96" font-size="27">Efficiency</text>

  <!-- ── Row A : turn 1, rank 7 ── -->
  <text x="120" y="432" fill="#8D9C96" font-size="34">Convert on turn 1, at rank 7</text>
  <rect x="720" y="398" width="420" height="56" fill="#33463E"/>
  <rect x="1140" y="398" width="36"  height="56" fill="#3ED39A"/>
  <rect x="1176" y="398" width="168" height="56" fill="#4A5C69"/>
  <text x="1800" y="442" fill="#8D9C96" font-size="62" font-weight="700" text-anchor="end"
        font-family="'IBM Plex Mono',ui-monospace,monospace">0.743</text>

  <!-- ── Row B : turn 2, rank 1 ── -->
  <text x="120" y="562" fill="#E7EEEA" font-size="34" font-weight="600">Convert on turn 2, at rank 1</text>
  <rect x="720" y="528" width="420" height="56" fill="#33463E"/>
  <rect x="1140" y="528" width="252" height="56" fill="url(#mrr)"/>
  <rect x="1392" y="528" width="151" height="56" fill="#4A5C69"/>
  <text x="1800" y="572" fill="#4EE0A8" font-size="62" font-weight="700" text-anchor="end"
        font-family="'IBM Plex Mono',ui-monospace,monospace">0.980</text>

  <!-- The trade -->
  <line x1="120" y1="648" x2="1800" y2="648" stroke="#2C3833" stroke-width="2"/>
  <text x="120" y="716" fill="#E7EEEA" font-size="40" font-weight="600">Waiting one more turn trades a little for a lot</text>

  <text x="120" y="796" fill="#8D9C96" font-size="34">MRR gained</text>
  <rect x="520" y="766" width="514" height="42" rx="5" fill="url(#mrr)"/>
  <text x="1064" y="798" fill="#4EE0A8" font-size="42" font-weight="700"
        font-family="'IBM Plex Mono',ui-monospace,monospace">+0.257</text>

  <text x="120" y="872" fill="#8D9C96" font-size="34">Efficiency lost</text>
  <rect x="520" y="842" width="40" height="42" rx="5" fill="#4A5C69"/>
  <text x="590" y="874" fill="#8D9C96" font-size="42" font-weight="600"
        font-family="'IBM Plex Mono',ui-monospace,monospace">−0.020</text>

  <text x="1800" y="838" fill="#E7EEEA" font-size="74" font-weight="700" text-anchor="end"
        font-family="'IBM Plex Mono',ui-monospace,monospace">12.9×</text>

  <!-- Takeaway -->
  <line x1="120" y1="928" x2="1800" y2="928" stroke="#2C3833" stroke-width="2"/>
  <text x="120" y="986" fill="#E7EEEA" font-size="34">So on early turns we show <tspan fill="#4EE0A8" font-weight="700">one</tspan> product, not ten.</text>
  <text x="120" y="1030" fill="#E7EEEA" font-size="34">Sessions ranked first: <tspan fill="#8D9C96">106</tspan> → <tspan fill="#4EE0A8" font-weight="700">192</tspan> out of 200.</text>
</svg>
