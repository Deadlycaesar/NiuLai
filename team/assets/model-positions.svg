<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif">
  <!--
    Demo video · Act 5 前段 visual · 1920x1080 (native recording resolution)
    ENGLISH ONLY — judge-facing asset.
    09-01 新增：幕 5 原本整段配一个几乎静止的终端，62 秒口播里前 47 秒无任何视觉支撑
    （五个论点只有最后一个和画面对得上）。本卡承载前三个论点。

    Numbers (all from REPORT §7 / team/experiments.md):
      Ranking      titles only        -0.020
                   with hit evidence  -0.0004   (3-run mean 0.9511 +-0.0005 => a tie)
                   latency            106x      (9.7 s -> 18 min, full set)
      Understanding L4 hardest level  0.8269 -> 0.9168  = +0.0899 ~ +0.090
                   range across L1-L4 +0.012 .. +0.090
    Verify: python3 -c "print(round(0.9168-0.8269,4))"

    LAYOUT BUDGET — keep these or text collides (this bit prior-axis.svg once already):
      row marker     x 120  (40px glyph)
      row label      x 190 ...  900   (font 44, <= 26 chars)
      row sub-label  x 190 ... 1100   (font 30, <= 48 chars)
      big value      right-aligned at x 1800, 74px mono, <= 7 glyphs => starts >= 1500
      value caption  right-aligned at x 1800, font 27, <= 20 chars
      bottom copy    x 120, font <= 44 title / <= 32 sub, <= 76 chars per line
    Verify by rendering the whole frame, never by reading source — use team/assets/export-png.sh
    (headless Chrome). NOTE: XML comments must not contain a double hyphen, so CLI flags are not
    spelled out here; writing them out is what broke the first render of this very file.
  -->
  <rect x="0" y="0" width="1920" height="1080" fill="#0E1512"/>

  <!-- Title -->
  <text x="120" y="146" fill="#E7EEEA" font-size="58" font-weight="700">We put the model in two places</text>
  <text x="120" y="204" fill="#8D9C96" font-size="32">Same model, same catalogue  ·  opposite results</text>
  <line x1="120" y1="248" x2="1800" y2="248" stroke="#2C3833" stroke-width="2"/>

  <!-- Row 1 — ranking: failed -->
  <text x="120" y="448" fill="#E8796B" font-size="46" font-weight="700">✗</text>
  <text x="190" y="424" fill="#8D9C96" font-size="44" font-weight="600">Ranking the products</text>
  <text x="190" y="476" fill="#8D9C96" font-size="30">listwise re-rank of the top 20  ·  106× slower</text>
  <text x="1800" y="440" fill="#8D9C96" font-size="74" font-weight="700" text-anchor="end"
        font-family="'IBM Plex Mono',ui-monospace,monospace">−0.020</text>
  <text x="1800" y="486" fill="#8D9C96" font-size="27" text-anchor="end">at best, a tie</text>

  <line x1="120" y1="560" x2="1800" y2="560" stroke="#1B2521" stroke-width="2"/>

  <!-- Row 2 — understanding: worked -->
  <text x="120" y="700" fill="#4EE0A8" font-size="46" font-weight="700">✓</text>
  <text x="190" y="676" fill="#E7EEEA" font-size="44" font-weight="600">Understanding the words</text>
  <text x="190" y="728" fill="#8D9C96" font-size="30">when the shopper's phrasing is rewritten</text>
  <text x="1800" y="692" fill="#4EE0A8" font-size="74" font-weight="700" text-anchor="end"
        font-family="'IBM Plex Mono',ui-monospace,monospace">+0.090</text>
  <text x="1800" y="738" fill="#8D9C96" font-size="27" text-anchor="end">at the hardest level</text>

  <!-- Takeaway -->
  <line x1="120" y1="838" x2="1800" y2="838" stroke="#2C3833" stroke-width="2"/>
  <text x="120" y="912" fill="#E7EEEA" font-size="44" font-weight="700">So the model <tspan fill="#4EE0A8">listens</tspan>. It doesn't rank.</text>
  <text x="120" y="972" fill="#8D9C96" font-size="32">The public set can't show paraphrasing — so we built that test ourselves.</text>
</svg>
